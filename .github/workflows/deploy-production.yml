name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  deployments: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Deploying version: $TAG"

          # Ensure tag follows semver
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must follow semver format (v0.0.0)"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://infinite-realms.ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: |
          npm run lint
          npm run server:test
          npx vitest run --coverage

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
          VITE_ENVIRONMENT: production
          SITE_URL: https://infinite-realms.ai
          VITE_GEMINI_API_KEYS: ${{ secrets.VITE_GEMINI_API_KEYS }}
          VITE_GOOGLE_GEMINI_API_KEY: ${{ secrets.VITE_GOOGLE_GEMINI_API_KEY }}
        run: npm run build

      - name: Generate build metadata
        run: |
          cat > dist/build-info.json << EOF
          {
            "version": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "branch": "${{ github.ref }}",
            "actor": "${{ github.actor }}"
          }
          EOF

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 30

      - name: Deploy to Production
        id: deploy
        run: |
          # Production deployment logic
          echo "Deploying to production..."
          # npm install -g vercel
          # vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          echo "Production deployment would execute here"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run server:build

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Running database migrations..."
          # npm run db:migrate
          echo "Migrations would run here"

      - name: Deploy backend
        run: |
          echo "Deploying backend to production..."
          # Add production backend deployment
        env:
          BACKEND_DEPLOY_TOKEN: ${{ secrets.PROD_BACKEND_DEPLOY_TOKEN }}

  post-deploy:
    runs-on: ubuntu-latest
    needs: [build, deploy-backend]
    steps:
      - name: Run production smoke tests
        run: |
          # Wait for deployment to propagate
          sleep 30

          # Health check
          curl -f https://infinite-realms.ai/health || exit 1
          echo "Production health check passed"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Production deployment successful"
          # Add Slack/Discord notification here
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

      - name: Rollback on failure
        if: failure()
        run: |
          echo "::error::Production deployment failed - manual rollback required"
          # Add rollback logic or notification
